[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
anvil = "http://localhost:8545"
hardhat = "http://localhost:8545"

[etherscan]
# API key for contract verification (optional)

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

